<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body { font-family: Arial; background:#f1f1f1; display:flex; height:100vh; align-items:center; justify-content:center; }
        .box { background:white; padding:30px; border-radius:8px; width:300px; }
        input { width:100%; padding:10px; margin:10px 0; }
        button { width:100%; padding:10px; background:#34495e; color:white; border:none; }
        .error { color:red; }
    </style>
</head>
<body>
<div class="box">
    <h2>Admin Login</h2>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
